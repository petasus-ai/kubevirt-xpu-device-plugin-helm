apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Values.vendorName }}-kubevirt-xpu-device-plugin
  namespace: {{ .Values.vendorName }}
  labels:
    app: {{ .Values.vendorName }}-kubevirt-xpu-device-plugin
spec:
  selector:
    matchLabels:
      name: {{ .Values.vendorName }}-kubevirt-xpu-device-plugin
  template:
    metadata:
      labels:
        name: {{ .Values.vendorName }}-kubevirt-xpu-device-plugin
    spec:
      priorityClassName: system-node-critical
      serviceAccountName: {{ .Values.vendorName }}-kubevirt-xpu-device-plugin
      initContainers:
      - args:
        - kubevirt-xpu-validator
        command:
        - sh
        - -c
        env:
        - name: COMPONENT
          value: vfio-pci
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              apiVersion: v1
              fieldPath: spec.nodeName
        - name: DEFAULT_XPU_WORKLOAD_CONFIG
          value: vm-passthrough
        - name: VENDOR_ID
          value: "0x{{ .Values.vendorId }}"
        - name: DEVICE_IDS
          value: '{{ join "," .Values.deviceIds }}'
        - name: VENDOR_DOMAIN
          value: "{{ .Values.vendorDomain }}"
        image: quay.io/edgestack/kubevirt-xpu-validator:latest
        imagePullPolicy: IfNotPresent
        name: vfio-pci-validation
        resources: {}
        securityContext:
          privileged: true
          seLinuxOptions:
            level: s0
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /host
          mountPropagation: HostToContainer
          name: host-root
          readOnly: true
        - mountPath: /sys
          mountPropagation: HostToContainer
          name: host-sys
          readOnly: true
        - mountPath: /run/xpu/validations
          mountPropagation: Bidirectional
          name: run-xpu-validations
      containers:
        - name: {{ .Values.vendorName }}-kubevirt-xpu-device-plugin
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [ "kubevirt-xpu-device-plugin" ]
          args:
            - "--vendor_name={{ .Values.vendorName }}"
            - "--vendor_id={{ .Values.vendorId }}"
            - "--vendor_domain={{ .Values.vendorDomain }}"
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: vfio
              mountPath: /dev/vfio
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: vfio
          hostPath:
            path: /dev/vfio
        - name: run-xpu-validations
          hostPath:
            path: /run/xpu/validations
            type: DirectoryOrCreate
        - name: host-root
          hostPath:
            path: /
            type: ""
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
      resources:
        limits:
          memory: 200Mi
        requests:
          cpu: 100m
          memory: 200Mi
